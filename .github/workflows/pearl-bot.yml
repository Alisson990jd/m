name: pearl-bot

# DESATIVADO: o bot agora roda na VM (pearl-bot/install_vm.sh). Rodar nos dois lugares ao mesmo tempo
# faz os dois mexerem nas mesmas maquinas. So roda se alguem disparar a mao (workflow_dispatch, no main).
# Para voltar a usar o Actions, desligue a VM e devolva os gatilhos:
#   schedule: [{cron: "17 * * * *"}]   (producao, ~5h40 por job)
#   push: {branches: [ccr-2c0cdf22-hm31ht], paths: ["pearl-bot/**"]}   (teste de 60 min)
on:
  workflow_dispatch:

concurrency:
  group: pearl-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      PRL_WALLET: prl1py93nqcyanqyhvkh4vdp9jsm95qsv02kt30avrf4p0r7w692ke6tqw9p6sx
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar estado (lista negra e hashrate aprendido)
        uses: actions/cache/restore@v4
        with:
          path: pearl-bot/state.json
          key: pearl-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pearl-state-

      - name: Testes
        working-directory: pearl-bot
        run: python3 -m unittest -q test_pearl_bot

      - name: Rodar o bot
        working-directory: pearl-bot
        run: |
          if [ -z "$VAST_API_KEY" ]; then
            echo "::warning::secret VAST_API_KEY nao configurado: so simulando"
            ARGS="--once"
          elif [ "$EVENT" = "push" ]; then
            ARGS="--live --max-minutes 60 --stop-all-at-end"
          else
            ARGS="--live --max-minutes 340 --handoff-margin-min 90"
          fi
          echo "modo: $EVENT $ARGS"
          python3 pearl_bot.py run $ARGS

      - name: Teste - destruir as maquinas do bot mesmo se o job for cancelado
        if: always() && env.EVENT == 'push' && env.VAST_API_KEY != ''
        working-directory: pearl-bot
        run: python3 pearl_bot.py stop-all --live

      - name: Salvar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pearl-bot/state.json
          key: pearl-state-${{ github.run_id }}-${{ github.run_attempt }}
